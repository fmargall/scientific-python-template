name: Bug report
description: Report a generated project that is broken, or a template that fails to render.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: >-
        What happens, and what you expected instead. The failing command with its output,
        and the content of `.copier-answers.yml`, help a lot if you have them.
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System information
      description: Template version (`_commit` in `.copier-answers.yml`), versions of Copier and uv, and operating system.
      placeholder: Template v0.1.0, Copier 9.19.1, uv 0.13.1, Windows 11
