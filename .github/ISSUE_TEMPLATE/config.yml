# Settings of the "New issue" chooser page
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository#configuring-the-template-chooser

# The forms of this folder cover the usual cases (bugs, features, questions,
# documentation), but a blank issue stays available for anything they do not fit
blank_issues_enabled: true

contact_links:
  # Vulnerabilities must never be reported in a public issue. This opens a
  # private security advisory instead ("Private vulnerability reporting" must be
  # enabled in Settings > Security)
  - name: Report a security vulnerability
    url: https://github.com/fmargall/python-template/security/advisories/new
    about: Please report vulnerabilities privately, not in a public issue.
