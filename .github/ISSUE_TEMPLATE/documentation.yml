name: Documentation
description: Report missing, incorrect or unclear documentation of the template.
labels: [documentation]
body:
  - type: textarea
    id: description
    attributes:
      label: Documentation issue
      description: What is missing, incorrect or unclear, and where (README, contributing guide, or a generated file).
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: How the documentation could be improved, if you have an idea.
