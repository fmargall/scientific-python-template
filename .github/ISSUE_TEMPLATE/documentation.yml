name: Documentation
description: Report missing, incorrect or unclear documentation of the template.
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: >-
        The file and section concerned, ideally as a link: the README or contributing guide
        of this repository, or a documentation file generated in the projects.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Missing documentation
        - Incorrect or outdated documentation
        - Unclear documentation
        - Typo or formatting
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or missing.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: How the documentation could be improved, if you have an idea.
