name: Test template

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab, for example after a release of a tool used
  # by the generated projects, without pushing anything
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hooks of this repository: hygiene, .editorconfig, spelling, workflows
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # CODE_OF_CONDUCT.md and SECURITY.md must stay the rendering of template/
  community-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --no-project --with jinja2 python scripts/check_community_files.py

  # The documentation of the template must build without any warning: a broken
  # reference or a page missing from the table of contents fails the CI
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # The newest Python versions can lack wheels of the docs dependencies
          # (PyYAML for MyST), which would then be built from source
          python-version: "3.13"
      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked --group docs
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

  # Generate a project for each set of answers of tests/answers/, and run all its
  # checks: hooks, tests, build, metadata, workflows and a first release
  generated-project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [agpl, mit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - env:
          CASE: ${{ matrix.case }}
        run: bash scripts/test-template.sh "$CASE" "$RUNNER_TEMP/project"

  # Single required status check for the main branch ruleset: it passes only
  # if every job below succeeded, so the matrix can change without updating
  # the ruleset. Any new job must be added to `needs`, or its failure will not
  # block merging.
  ci-passed:
    # A job whose dependency failed is skipped, and a skipped required check
    # counts as passing: always() makes it run and report the real outcome
    if: always()
    needs: [lint, community-files, docs, generated-project]
    runs-on: ubuntu-latest
    steps:
      # A cancelled job proved nothing, so it fails the check too
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
