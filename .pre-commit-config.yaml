repos:
  # Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Keep two trailing spaces in Markdown (hard line break)
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Enforce .editorconfig rules on every file
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        # License and code of conduct texts are kept verbatim and must not be reformatted
        exclude: ^(LICENSE\.txt|CODE_OF_CONDUCT\.md|licenses/.*|template/CODE_OF_CONDUCT\.md\.jinja)$

  # Find common misspellings, in the template files too. It only reports them: a
  # word it does not know can be allowed with --ignore-words-list=word1,word2 in args
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # Verbatim texts
        exclude: ^(LICENSE\.txt|CODE_OF_CONDUCT\.md|licenses/.*|template/CODE_OF_CONDUCT\.md\.jinja)$

  # Audit the workflows of this repository, dependabot.yml and this file for
  # security issues. The .jinja workflows of template/ are audited in the
  # generated projects instead, by scripts/test-template.sh
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
