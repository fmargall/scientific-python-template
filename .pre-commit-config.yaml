repos:
  # Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Keep two trailing spaces in Markdown (hard line break)
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Enforce .editorconfig rules on every file
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        # License and code of conduct texts are kept verbatim and must not be reformatted
        exclude: ^(LICENSE\.txt|CODE_OF_CONDUCT\.md|licenses/.*|template/CODE_OF_CONDUCT\.md\.jinja)$
