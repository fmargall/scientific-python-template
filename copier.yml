_subdirectory: template
_min_copier_version: "9.0"

# Shown at the end of `copier copy`: the steps the template cannot do itself,
# because they run commands (which Copier only allows with --trust) or happen
# outside of this machine (GitHub, PyPI, Codecov)
_message_after_copy: |
  {{ project_name }} has been generated. Next steps:

  1. Create the repository on the main branch (the one the CI runs on), the
      environment and the lock file (uv.lock, required by the CI), install the
      pre-commit hooks, and commit everything:

        cd {{ _copier_conf.dst_path }}
        git init -b main
        uv sync
        uv run pre-commit install
        git add --all
        git commit -m "🎉 chore: generate the project from python-template"

  2. Push to {{ repository_url }}, then in the Settings of the repository:
      - Security: enable "Private vulnerability reporting" (used by SECURITY.md)
      - Environments: create the "testpypi" and "pypi" environments

  3. On TestPyPI and PyPI, add a trusted publisher for the release.yml workflow,
      with the environment of the same name, to publish without any token.

  4. Optionally, enable the repository on Zenodo (Account > GitHub): each GitHub
      release is then archived with a DOI, described by CITATION.cff.
  {%- if use_codecov %}

  5. Install the Codecov GitHub app for the repository, or the tests job fails.
  {%- endif %}

# Shown at the end of `copier update`
_message_after_update: |
  {{ project_name }} has been updated. Before committing:

  1. Review the changes with `git diff`, and resolve the conflicts, if any
      (conflict markers in the files, or *.rej files).
  2. Update the lock file if pyproject.toml changed, then run all the checks:

        uv lock
        uv sync
        uv run pre-commit run --all-files
        uv run pytest

project_name:
  type: str
  help: Project name (shown in the README.md)
  validator: >-
    {% if not project_name.strip() %}
    The project name cannot be empty.
    {% endif %}

package_name:
  type: str
  help: Import name of the Python package (e.g. import lux_machina)
  default: "{{ project_name.strip() | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not (package_name.isidentifier() and package_name.isascii() and package_name == package_name.lower()) %}
    The package name must be a valid lowercase ASCII Python identifier.
    {% endif %}

distribution_name:
  type: str
  help: Distribution name, as published on PyPI (e.g. pip install lux-machina)
  default: "{{ package_name | replace('_', '-') }}"
  validator: >-
    {% if not (distribution_name and distribution_name.isascii()
      and distribution_name.replace('-', '').replace('_', '').replace('.', '').isalnum()
      and distribution_name[0].isalnum() and distribution_name[-1].isalnum()) %}
    The distribution name must only contain ASCII letters, digits, "-", "_" or ".",
    and start and end with a letter or digit.
    {% endif %}

# SPEC 0 (https://scientific-python.org/specs/spec-0000/): a Python version is
# supported for 3 years after its release. Python 3.N is released in October of
# year 2011 + N, so the oldest supported version is computed from today's date.
python_min_version:
  type: str
  help: Oldest supported Python version (default follows SPEC 0)
  default: "3.{{ ('%Y' | strftime | int) - (2013 if ('%m' | strftime | int) >= 10 else 2014) }}"
  validator: >-
    {% set parts = python_min_version.split('.') %}
    {% if not (parts | length == 2 and parts[0] == '3' and parts[1].isdigit() and parts[1] | int >= 10) %}
    The Python version must look like 3.N, with N >= 10.
    {% endif %}

# Newest released Python version, tested in CI. Never asked nor stored in the
# answers (when: false): it is computed again on each `copier update`, so that the
# CI matrix follows the Python releases.
python_max_version:
  type: str
  when: false
  default: "3.{{ ('%Y' | strftime | int) - (2011 if ('%m' | strftime | int) >= 10 else 2012) }}"

use_codecov:
  type: bool
  help: Upload the test coverage to Codecov (the Codecov GitHub app must be installed)
  default: true

repository_url:
  type: str
  help: URL of the repository (e.g. https://github.com/owner/repo)
  validator: >-
    {% if not repository_url.startswith("https://") %}
    The repository URL must start with https://.
    {% elif repository_url.endswith("/") or repository_url.endswith(".git") %}
    The repository URL must not end with "/" or ".git".
    {% endif %}

homepage_url:
  type: str
  help: URL of the project homepage or documentation (leave empty if none)
  default: ""
  validator: >-
    {% if homepage_url and not homepage_url.startswith("https://") %}
    The homepage URL must start with https://.
    {% endif %}

project_description:
  type: str
  help: One-line summary of the project, ending with a period (package docstring, CITATION.cff)
  validator: >-
    {% if not project_description.strip() %}
    The project description cannot be empty.
    {% elif "\n" in project_description %}
    The project description must fit on a single line.
    {% elif not project_description.strip().endswith(".") %}
    The project description must end with a period.
    {% elif "\\" in project_description or '"""' in project_description %}
    The project description cannot contain a backslash or triple quotes.
    {% endif %}

keywords:
  type: yaml
  help: Keywords describing the project, as a YAML list (e.g. [optics, rendering])
  default: []
  validator: >-
    {% if keywords is not sequence or keywords is string %}
    The keywords must be a YAML list.
    {% endif %}

license:
  type: str
  help: License of the project (SPDX identifier)
  choices:
    - MIT
    - AGPL-3.0-or-later

# Author
author_given_names:
  type: str
  help: Author given names (first names)
  validator: >-
    {% if not author_given_names.strip() %}
    The author given names cannot be empty.
    {% endif %}

author_family_names:
  type: str
  help: Author family names (last names)
  validator: >-
    {% if not author_family_names.strip() %}
    The author family names cannot be empty.
    {% endif %}

author_email:
  type: str
  help: Author email (leave empty to not publish it)
  default: ""
  validator: >-
    {% if author_email and "@" not in author_email %}
    The author email is not valid.
    {% endif %}

author_orcid:
  type: str
  help: Author ORCID, as a full URL (e.g. https://orcid.org/0000-0000-0000-0000), or empty
  default: ""
  validator: >-
    {% if author_orcid and not (author_orcid.startswith("https://orcid.org/") and author_orcid | length == 37) %}
    The ORCID must look like https://orcid.org/0000-0000-0000-0000.
    {% endif %}

conduct_email:
  type: str
  help: Email to report code of conduct violations (shown in CODE_OF_CONDUCT.md)
  default: "{{ author_email }}"
  validator: >-
    {% if "@" not in conduct_email %}
    A valid email is required to report code of conduct violations.
    {% endif %}

# Copyright
copyright_holder:
  type: str
  help: Copyright holder (shown in LICENSE.txt)
  default: "{{ author_given_names }} {{ author_family_names }}"
  validator: >-
    {% if not copyright_holder.strip() %}
    The copyright holder cannot be empty.
    {% endif %}

copyright_year:
  type: str
  help: Year of the copyright notice
  default: "{{ '%Y' | strftime }}"
  validator: >-
    {% if not (copyright_year | length == 4 and copyright_year.isdigit()) %}
    The copyright year must be a 4-digit year.
    {% endif %}

# Stored in the answers like any other: ADR-0001 keeps the same date across updates
creation_date:
  type: str
  help: Creation date of the project, YYYY-MM-DD (date of ADR-0001)
  default: "{{ '%Y-%m-%d' | strftime }}"
  validator: >-
    {% set parts = creation_date.split('-') %}
    {% if not (parts | map('length') | list == [4, 2, 2] and (parts | join).isdigit()) %}
    The creation date must look like YYYY-MM-DD.
    {% endif %}
